    function App() {
      const [tutorSettings, setTutorSettings] = useState(() => {
        const saved = localStorage.getItem('pcb_tutor_settings');
        return saved ? JSON.parse(saved) : INITIAL_TUTOR_SETTINGS;
      });

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('pcb_users');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('pcb_sessions');
        return saved ? JSON.parse(saved) : INITIAL_SESSIONS;
      });

      // Default to null so user lands on Login Page on first load
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('pcb_current_user');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch(e) {}
        }
        return null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginRole, setLoginRole] = useState('student');
      const [resourceModal, setResourceModal] = useState(null); 
      const [notification, setNotification] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('pcb_tutor_settings', JSON.stringify(tutorSettings));
      }, [tutorSettings]);

      useEffect(() => {
        localStorage.setItem('pcb_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('pcb_sessions', JSON.stringify(sessions));
      }, [sessions]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('pcb_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('pcb_current_user');
        }
      }, [currentUser]);

      const approvedStudents = useMemo(() => {
        return users.filter(u => u.role === 'student' && u.status === 'approved');
      }, [users]);

      const pendingStudents = useMemo(() => {
        return users.filter(u => u.role === 'student' && u.status === 'pending');
      }, [users]);

      const totalSeatsFilled = approvedStudents.length;

      const showToast = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const handleApproveStudent = (studentId) => {
        if (totalSeatsFilled >= MAX_CAPACITY) {
          showToast(`Maximum capacity of ${MAX_CAPACITY} students reached! Cannot approve more students right now.`, 'error');
          return;
        }

        const nextSeatNum = totalSeatsFilled + 1;
        setUsers(prev => prev.map(u => {
          if (u.id === studentId) {
            return { ...u, status: 'approved', seatNumber: nextSeatNum };
          }
          return u;
        }));
        showToast("Student enrollment approved successfully!", "success");
      };

      const handleDeclineStudent = (studentId) => {
        setUsers(prev => prev.filter(u => u.id !== studentId));
        showToast("Student application declined.", "info");
      };

      const handleRemoveStudent = (studentId) => {
        setUsers(prev => prev.filter(u => u.id !== studentId));
        setSessions(prev => prev.filter(s => s.studentId !== studentId));
        showToast("Student removed from enrollment roster.", "info");
      };

      const handleAddSession = (newSessionData) => {
        const student = users.find(u => u.id === newSessionData.studentId);
        const newSession = {
          id: 'sess_' + Date.now(),
          studentId: newSessionData.studentId,
          studentName: student ? student.name : "Student",
          subject: newSessionData.subject,
          topic: newSessionData.topic,
          date: newSessionData.date,
          notesUrl: newSessionData.notesUrl || "",
          videoUrl: newSessionData.videoUrl || "",
          notesText: newSessionData.notesText || ""
        };

        setSessions(prev => [newSession, ...prev]);
        showToast(`Logged 1:1 ${newSessionData.subject} coaching session!`, "success");
      };

      const handleDeleteSession = (sessionId) => {
        setSessions(prev => prev.filter(s => s.id !== sessionId));
        showToast("Session entry deleted successfully.", "info");
      };

      const handleResetDemoData = () => {
        setTutorSettings(INITIAL_TUTOR_SETTINGS);
        setUsers(INITIAL_STUDENTS);
        setSessions(INITIAL_SESSIONS);
        showToast("Demo platform data reset to default!", "success");
      };

      return (
        <div className="min-h-screen flex flex-col font-sans paper-texture">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-bold flex items-center space-x-2 border animate-bounce ${
              notification.type === 'error' ? 'bg-red-900 text-red-100 border-red-700' :

    function AuthScreen({ authMode, setAuthMode, loginRole, setLoginRole, users, setUsers, setCurrentUser, showToast, totalSeatsFilled, maxCapacity, tutorSettings }) {
      const [loginUser, setLoginUser] = useState('');
      const [loginPass, setLoginPass] = useState('');

      const [formData, setFormData] = useState({
        fullName: '',
        username: '',
        password: '',
        grade: '12',
        board: 'CBSE',
        neet: true,
        kcet: false
      });

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const usernameInput = loginUser.trim().toLowerCase();
        
        const found = users.find(u => 
          (u.username.toLowerCase() === usernameInput || (u.role === 'tutor' && (usernameInput === 'mukund' || usernameInput === 'admin'))) && 
          u.password === loginPass
        );

        if (found) {
          setCurrentUser(found);
          showToast(`Welcome back, ${found.name}!`, "success");
        } else {
          showToast("Invalid username or password. Please check credentials.", "error");
        }
      };

      const handleQuickLogin = (roleType) => {
        if (roleType === 'admin') {
          const tutor = users.find(u => u.role === 'tutor') || { id: "tutor1", username: "mukund", password: "123", role: "tutor", name: "Mukund Wankhede", status: "approved" };
          setCurrentUser(tutor);
          showToast("Logged in as Admin: Mukund Wankhede", "success");
        } else {
          const student = users.find(u => u.id === 's1') || users.find(u => u.role === 'student');
          if (student) {
            setCurrentUser(student);
            showToast(`Logged in as Student: ${student.name}`, "success");
          }
        }
      };

      const handleSignupSubmit = (e) => {
        e.preventDefault();
        if (!formData.fullName || !formData.username || !formData.password) {
          showToast("Please fill in all required fields", "error");
          return;
        }

        if (users.some(u => u.username.toLowerCase() === formData.username.trim().toLowerCase())) {
          showToast("Username already exists. Please choose another.", "error");
          return;
        }

        const exams = [];
        if (formData.neet) exams.push("NEET");
        if (formData.kcet) exams.push("KCET");

        const newStudent = {
          id: 's_' + Date.now(),
          username: formData.username.trim(),
          password: formData.password,
          role: 'student',
          name: formData.fullName.trim(),
          grade: formData.grade,
          board: formData.board,
          exams: exams,
          status: 'pending',
          joinedDate: new Date().toISOString().split('T')[0]

        setUsers(prev => [...prev, newStudent]);
        setCurrentUser(newStudent);
        showToast("Enrollment application submitted successfully!", "success");

              <MukundLogo className="h-12" />

              Personalized 1:1 Physics, Chemistry & Biology Coaching for Classes 9-12 • NEET & KCET Preparation

          </div>

          {/* Form Box */}
          <div className="bg-white/95 backdrop-blur rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
            {/* Top Auth Mode Tabs */}

              <button
                onClick={() => { setAuthMode('login'); setLoginRole('student'); }}

              >
                🎓 Student Login
              </button>

              <button
                onClick={() => { setAuthMode('login'); setLoginRole('admin'); }}
                className={`flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition ${authMode === 'login' && loginRole === 'admin' ? 'bg-slate-900 text-white shadow' : 'text-slate-700 hover:bg-slate-200/60'}`}
              >
                👨‍🏫 Admin Login (Mukund Wankhede)

              <button
                onClick={() => setAuthMode('signup')}
                className={`flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition ${authMode === 'signup' ? 'bg-amber-800 text-white shadow' : 'text-slate-700 hover:bg-slate-200/60'}`}
              >
                ✍️ New Enrollment
              </button>
            </div>

            {authMode === 'login' ? (
              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs flex items-center justify-between">
                  <span className="font-bold text-slate-800">
                    {loginRole === 'admin' ? 'Logging in as Platform Admin (Mukund Wankhede)' : 'Logging in as Enrolled Student'}
                  </span>
                  <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${loginRole === 'admin' ? 'bg-slate-900 text-white' : 'bg-emerald-100 text-emerald-800'}`}>
                    {loginRole === 'admin' ? 'Admin Portal' : 'Student Portal'}
                  </span>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                  <input
                    type="text"
                    required
                    value={loginUser}
                    onChange={(e) => setLoginUser(e.target.value)}
                    placeholder={loginRole === 'admin' ? "Admin username (e.g. mukund)" : "Student username (e.g. aarav)"}
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-slate-800 text-sm font-medium"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                  <input
                    type="password"
                    required
                    value={loginPass}
                    onChange={(e) => setLoginPass(e.target.value)}
                    placeholder="Enter password (Demo default: 123)"
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-slate-800 text-sm font-medium"
                  />
                </div>

                <button
                  type="submit"
                  className={`w-full py-3 text-white font-bold rounded-xl transition shadow-md ${loginRole === 'admin' ? 'bg-slate-900 hover:bg-slate-800' : 'bg-emerald-700 hover:bg-emerald-800'}`}
                >
                  Sign In to {loginRole === 'admin' ? 'Admin Control Dashboard' : 'Student Learning Portal'}
                </button>

                {/* 1-Click Demo Shortcut Login Bar */}
                <div className="pt-4 border-t border-slate-200">
                  <p className="text-xs font-bold text-slate-600 mb-2">⚡ Quick 1-Click Login Shortcuts:</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('admin')}
                      className="py-2 px-3 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1"
                    >
                      <span>👨‍🏫</span> Admin (Mukund Wankhede)
                    </button>
                    <button
                      type="button"
                      onClick={() => handleQuickLogin('student')}
                      className="py-2 px-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1"
                    >
                      <span>🎓</span> Student (Aarav)
                    </button>
                  </div>
                </div>
              </form>
            ) : (
              <form onSubmit={handleSignupSubmit} className="space-y-4">
                {totalSeatsFilled >= maxCapacity && (
                  <div className="p-3 bg-amber-50 border border-amber-300 rounded-lg text-xs text-amber-900 font-medium">
                    ⏳ <strong>Notice:</strong> All 30 seats are currently filled. Submitting now will place you on the waitlist with Mukund Sir.
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Student Name *</label>
                  <input
                    type="text"
                    required
                    value={formData.fullName}
                    onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                    placeholder="e.g. Rohan Verma"
                    className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username *</label>
                    <input
                      type="text"
                      required
                      value={formData.username}
                      onChange={(e) => setFormData({ ...formData, username: e.target.value })}
                      placeholder="e.g. rohanv"
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password *</label>
                    <input
                      type="password"
                      required
                      value={formData.password}
                      onChange={(e) => setFormData({ ...formData, password: e.target.value })}
                      placeholder="Create password"
                      className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none text-sm"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Class / Grade *</label>
                    <select
                      value={formData.grade}
                      onChange={(e) => setFormData({ ...formData, grade: e.target.value })}
                      className="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 text-sm font-medium"
                    >
                      <option value="9">Class 9</option>
                      <option value="10">Class 10</option>
                      <option value="11">Class 11</option>
                      <option value="12">Class 12</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Board *</label>
                    <select
                      value={formData.board}
                      onChange={(e) => setFormData({ ...formData, board: e.target.value })}
                      className="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 text-sm font-medium"
                    >
                      <option value="CBSE">CBSE</option>
                      <option value="ICSE">ICSE</option>
                      <option value="State">State Board</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Target Competitive Exams (Optional)</label>
                  <div className="flex space-x-4">
                    <label className="flex items-center space-x-2 text-sm font-semibold text-slate-700 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={formData.neet}
                        onChange={(e) => setFormData({ ...formData, neet: e.target.checked })}
                        className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                      />
                      <span>NEET Prep</span>
                    </label>
                    <label className="flex items-center space-x-2 text-sm font-semibold text-slate-700 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={formData.kcet}
                        onChange={(e) => setFormData({ ...formData, kcet: e.target.checked })}
                        className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                      />
                      <span>KCET Prep</span>
                    </label>

                  type="submit"

          </div>

      );

    function TutorDashboard({ tutorSettings, setTutorSettings, users, approvedStudents, pendingStudents, totalSeatsFilled, maxCapacity, sessions, onApproveStudent, onDeclineStudent, onRemoveStudent, onAddSession, onDeleteSession, onResetDemoData, setResourceModal }) {
      const [filterStudentId, setFilterStudentId] = useState('all');
      const [newSessionForm, setNewSessionForm] = useState({
        studentId: approvedStudents[0]?.id || '',
        subject: 'Physics',
        topic: '',
        date: new Date().toISOString().split('T')[0],
        notesUrl: '',
        videoUrl: '',
        notesText: ''
      });

      useEffect(() => {
        if (!newSessionForm.studentId && approvedStudents.length > 0) {
          setNewSessionForm(prev => ({ ...prev, studentId: approvedStudents[0].id }));
        }
      }, [approvedStudents]);

      const handleScheduleSubmit = (e) => {
        e.preventDefault();
        if (!newSessionForm.studentId || !newSessionForm.topic) {
          alert("Please select a student and enter a topic.");
          return;
        }
        onAddSession(newSessionForm);
        setNewSessionForm(prev => ({ ...prev, topic: '', notesUrl: '', videoUrl: '', notesText: '' }));
      };

      const filteredSessions = useMemo(() => {
        if (filterStudentId === 'all') return sessions;
        return sessions.filter(s => s.studentId === filterStudentId);
      }, [sessions, filterStudentId]);

      const capacityPercentage = Math.min(Math.round((totalSeatsFilled / maxCapacity) * 100), 100);

      return (
        <div className="space-y-6">
          {/* Top Banner Stats */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
              <div>
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">30-Seat Enrolled Capacity</p>
                <div className="flex items-baseline space-x-2 mt-1">
                  <span className="text-3xl font-extrabold text-slate-900">{totalSeatsFilled}</span>
                  <span className="text-slate-500 font-bold">/ {maxCapacity} Seats Filled</span>
                </div>
                <div className="w-36 bg-slate-200 rounded-full h-2 mt-2 overflow-hidden">
                  <div className="bg-emerald-600 h-2 rounded-full" style={{ width: `${capacityPercentage}%` }}></div>
                </div>
              </div>
              <div className="p-3 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-xl">
                🎓
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
              <div>
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Pending Enrollments</p>
                <span className="text-3xl font-extrabold text-amber-700 block mt-1">{pendingStudents.length}</span>
                <p className="text-[11px] text-slate-500 mt-1">Awaiting your review & approval</p>
              </div>
              <div className="p-3 bg-amber-50 text-amber-700 rounded-xl font-bold text-xl">
                ⏳
              </div>
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
              <div>
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Logged 1:1 Sessions</p>
                <span className="text-3xl font-extrabold text-indigo-700 block mt-1">{sessions.length}</span>
                <p className="text-[11px] text-slate-500 mt-1">Across Physics, Chem & Biology</p>
              </div>
              <div className="p-3 bg-indigo-50 text-indigo-700 rounded-xl font-bold text-xl">
                📚
              </div>
            </div>
          </div>

          {/* 30 Seats Grid Visualizer */}
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-3">
            <div className="flex justify-between items-center border-b pb-3">
              <div>
                <h3 className="font-extrabold text-slate-900 text-sm">30-Seat Interactive Register Roster</h3>
                <p className="text-xs text-slate-500">Each box represents a 1:1 personalized coaching slot with Mukund Wankhede</p>
              </div>
              <span className="text-xs font-bold bg-slate-100 px-3 py-1 rounded-full text-slate-700 border">
                {maxCapacity - totalSeatsFilled} Open Seats Remaining
              </span>
            </div>

            <div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-10 gap-2">
              {Array.from({ length: maxCapacity }).map((_, idx) => {
                const seatNum = idx + 1;
                const student = approvedStudents.find(s => s.seatNumber === seatNum) || approvedStudents[idx];
                const isOccupied = !!student;

                return (
                  <div
                    key={seatNum}
                    className={`p-2 rounded-xl text-center border flex flex-col justify-between h-16 transition ${
                      isOccupied ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-slate-50 border-dashed border-slate-300 text-slate-400'
                    }`}
                  >
                    <span className="text-[9px] font-extrabold block text-left">#{seatNum}</span>
                    {isOccupied ? (
                      <div className="truncate">
                        <p className="text-[10px] font-extrabold leading-none truncate">{student.name}</p>
                        <span className="text-[8px] font-semibold text-emerald-700">Cl. {student.grade}</span>
                      </div>
                    ) : (
                      <span className="text-[9px] font-semibold italic text-slate-400">Open Slot</span>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left Column: Enrollment Requests & Roster */}
            <div className="lg:col-span-1 space-y-6">
              {/* Pending Approvals Box */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-amber-500/10 px-4 py-3 border-b border-amber-200 flex justify-between items-center">
                  <h3 className="font-extrabold text-amber-900 text-sm flex items-center gap-1.5">
                    <span>📩</span> Pending Requests ({pendingStudents.length})
                  </h3>
                </div>

                <div className="p-4 space-y-3">
                  {pendingStudents.length === 0 ? (
                    <p className="text-xs text-slate-500 italic text-center py-4">No pending enrollment requests.</p>
                  ) : (
                    pendingStudents.map(student => (
                      <div key={student.id} className="p-3 bg-amber-50/50 border border-amber-200 rounded-xl space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-sm text-slate-900">{student.name}</p>
                            <p className="text-xs text-slate-500">Class {student.grade} • {student.board} Board</p>
                          </div>
                          <span className="text-[10px] font-bold bg-amber-200 text-amber-900 px-2 py-0.5 rounded">Pending</span>
                        </div>
                        {student.exams && student.exams.length > 0 && (
                          <div className="flex gap-1">
                            {student.exams.map(e => (
                              <span key={e} className="text-[10px] font-semibold bg-white border border-amber-300 text-amber-800 px-1.5 py-0.5 rounded">
                                {e}
                              </span>
                            ))}
                          </div>
                        )}
                        <div className="flex gap-2 pt-1">
                          <button
                            onClick={() => onApproveStudent(student.id)}
                            className="flex-1 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-1"
                          >
                            <Icons.UserCheck /> Approve Spot
                          </button>
                          <button
                            onClick={() => onDeclineStudent(student.id)}
                            className="px-2.5 py-1.5 bg-red-100 hover:bg-red-200 text-red-800 rounded-lg text-xs font-bold transition"
                            title="Decline"
                          >
                            <Icons.UserX />
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              {/* Enrolled Roster */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-900 text-white px-4 py-3 flex justify-between items-center">
                  <h3 className="font-extrabold text-sm flex items-center gap-1.5">
                    <span>🎓</span> Enrolled Roster ({approvedStudents.length}/{maxCapacity})
                  </h3>
                </div>

                <div className="p-4 divide-y divide-slate-100 max-h-[400px] overflow-y-auto space-y-2">
                  {approvedStudents.length === 0 ? (
                    <p className="text-xs text-slate-500 italic text-center py-4">No enrolled students yet.</p>
                  ) : (
                    approvedStudents.map(st => (
                      <div key={st.id} className="pt-2 flex items-center justify-between">
                        <div>
                          <div className="flex items-center gap-1.5">
                            <span className="text-[10px] font-extrabold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">
                              Seat #{st.seatNumber || '-'}
                            </span>
                            <span className="font-bold text-sm text-slate-900">{st.name}</span>
                          </div>
                          <p className="text-[11px] text-slate-500">Class {st.grade} ({st.board}) • User: <span className="font-mono">{st.username}</span></p>
                        </div>
                        <button
                          onClick={() => onRemoveStudent(st.id)}
                          className="text-slate-400 hover:text-red-600 p-1 rounded transition"
                          title="Remove Student & Free Seat"
                        >
                          <Icons.Trash />
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <button
                onClick={onResetDemoData}
                className="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition"
              >
                🔄 Reset Platform Demo Data
              </button>
            </div>

            {/* Right Column: Log Session & Session History Log */}
            <div className="lg:col-span-2 space-y-6">
              {/* Log Session Form */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-base flex items-center gap-2">
                    <Icons.PlusCircle /> Log a 1:1 Personal Coaching Session
                  </h3>
                  <span className="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                    Mukund Wankhede
                  </span>
                </div>

                <form onSubmit={handleScheduleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Select Enrolled Student *</label>
                      <select
                        value={newSessionForm.studentId}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, studentId: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-emerald-600"
                        required
                      >
                        {approvedStudents.length === 0 && <option value="">No enrolled students available</option>}
                        {approvedStudents.map(s => (
                          <option key={s.id} value={s.id}>
                            {s.name} (Class {s.grade} - {s.board})
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Subject Tag *</label>
                      <select
                        value={newSessionForm.subject}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, subject: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:ring-2 focus:ring-emerald-600"
                      >
                        <option value="Physics">⚡ Physics</option>
                        <option value="Chemistry">🧪 Chemistry</option>
                        <option value="Biology">🧬 Biology</option>
                        <option value="General">📖 General Guidance</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="md:col-span-2">
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Topic / Chapter Covered *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Optics & Wave Interference Numericals"
                        value={newSessionForm.topic}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, topic: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Date *</label>
                      <input
                        type="date"
                        required
                        value={newSessionForm.date}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, date: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Notes PDF Link (Google Drive / Cloud)</label>
                      <input
                        type="url"
                        placeholder="https://drive.google.com/file/d/..."
                        value={newSessionForm.notesUrl}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, notesUrl: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Video Recording Link (YouTube / Drive)</label>
                      <input
                        type="url"
                        placeholder="https://youtube.com/watch?v=..."
                        value={newSessionForm.videoUrl}
                        onChange={(e) => setNewSessionForm({ ...newSessionForm, videoUrl: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Session Summary / Key Takeaways Notes</label>
                    <textarea
                      rows="2"
                      placeholder="e.g. Solved 12 entrance exam MCQs. Homework assigned from NCERT Chapter 3."
                      value={newSessionForm.notesText}
                      onChange={(e) => setNewSessionForm({ ...newSessionForm, notesText: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-600"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={approvedStudents.length === 0}
                    className="w-full py-3 bg-emerald-700 hover:bg-emerald-800 disabled:bg-slate-300 text-white font-bold rounded-xl transition shadow-md flex items-center justify-center gap-2"
                  >
                    <span>📝</span> Save Session to Student's Private Register
                  </button>
                </form>
              </div>

              {/* Session History Log */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b pb-3">
                  <h3 className="font-extrabold text-slate-900 text-base flex items-center gap-2">
                    <span>🗓️</span> 1:1 Coaching Register Log ({filteredSessions.length})
                  </h3>

                  {/* Filter by student */}
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-slate-500">Filter:</span>
                    <select
                      value={filterStudentId}
                      onChange={(e) => setFilterStudentId(e.target.value)}
                      className="px-3 py-1.5 bg-slate-100 border border-slate-300 rounded-lg text-xs font-semibold"
                    >
                      <option value="all">All Enrolled Students</option>
                      {approvedStudents.map(s => (
                        <option key={s.id} value={s.id}>{s.name}</option>
                      ))}
                    </select>
                  </div>
                </div>

                <div className="space-y-3 max-h-[500px] overflow-y-auto">
                  {filteredSessions.length === 0 ? (
                    <p className="text-xs text-slate-500 italic py-6 text-center">No sessions logged for the selected filter.</p>
                  ) : (
                    filteredSessions.map(sess => (
                      <div key={sess.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/60 flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <div className="space-y-1">
                          <div className="flex items-center space-x-2">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${
                              sess.subject === 'Physics' ? 'bg-indigo-100 text-indigo-800' :
                              sess.subject === 'Chemistry' ? 'bg-amber-100 text-amber-800' :
                              sess.subject === 'Biology' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-800'
                            }`}>
                              {sess.subject}
                            </span>
                            <span className="font-bold text-sm text-slate-900">{sess.topic}</span>
                          </div>
                          <p className="text-xs text-slate-600">
                            Student: <strong className="text-slate-800">{sess.studentName}</strong> • Date: {sess.date}
                          </p>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => setResourceModal(sess)}
                            className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1"
                          >
                            <Icons.FileText /> View Notes & Video
                          </button>
                          <button
                            onClick={() => onDeleteSession(sess.id)}
                            className="p-1.5 text-slate-400 hover:text-red-600 rounded transition"
                            title="Delete Entry"
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StudentDashboard({ student, sessions, tutorSettings, setResourceModal, totalSeatsFilled, maxCapacity }) {
      const [subjectFilter, setSubjectFilter] = useState('ALL');

      // Filter available subjects that actually have logged sessions
      const availableSubjects = useMemo(() => {
        const set = new Set();
        sessions.forEach(s => set.add(s.subject));
        return Array.from(set);
      }, [sessions]);

      const filteredSessions = useMemo(() => {
        if (subjectFilter === 'ALL') return sessions;
        return sessions.filter(s => s.subject === subjectFilter);
      }, [sessions, subjectFilter]);

      return (
        <div className="space-y-6 max-w-4xl mx-auto">
          {/* Student Welcome Card */}
          <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white rounded-2xl p-6 shadow-lg border border-slate-700 relative overflow-hidden">
            <div className="relative z-10 space-y-2">
              <div className="flex items-center gap-2">
                <span className={`px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider border ${
                  student.status === 'approved' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                }`}>
                  {student.status === 'approved' ? `Seat #${student.seatNumber || 'Enrolled'}` : 'Waitlist / Pending'}
                </span>
                <span className="text-slate-300 text-xs font-medium">Class {student.grade} ({student.board} Board)</span>
              </div>
              <h2 className="text-2xl font-extrabold tracking-tight">Welcome, {student.name}!</h2>
              <p className="text-xs text-slate-300 max-w-xl">
                {tutorSettings.tagline} • Mentorship with {tutorSettings.tutorName}
              </p>
            </div>
          </div>

          {student.status === 'pending' ? (
            <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-6 text-amber-900 space-y-3 shadow-sm">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">⏳</span>
                <h3 className="font-extrabold text-base">Your Enrollment Request is Pending Review</h3>
              </div>
              <p className="text-xs leading-relaxed">
                Thank you for applying to Mukund Online Classes! Mukund Sir coaches a maximum of 30 students at a time to ensure 100% personalized 1:1 focus. Your request is in the queue and you will receive access as soon as Mukund Sir approves your enrollment slot.
              </p>
            </div>
          ) : (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
              <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-4">
                <div>
                  <h3 className="font-extrabold text-slate-900 text-lg">My 1:1 Learning Register</h3>
                  <p className="text-xs text-slate-500">Your personalized class notes and recording history with Mukund Sir</p>
                </div>

                {/* Subject Filter Tabs */}
                <div className="flex flex-wrap gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button
                    onClick={() => setSubjectFilter('ALL')}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${subjectFilter === 'ALL' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}
                  >
                    All ({sessions.length})
                  </button>
                  {availableSubjects.map(subj => (
                    <button
                      key={subj}
                      onClick={() => setSubjectFilter(subj)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${subjectFilter === subj ? 'bg-emerald-700 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}
                    >
                      {subj === 'Physics' ? '⚡ Physics' : subj === 'Chemistry' ? '🧪 Chemistry' : subj === 'Biology' ? '🧬 Biology' : subj}
                    </button>
                  ))}
                </div>
              </div>

              {/* Sessions Timeline */}
              <div className="space-y-4">
                {filteredSessions.length === 0 ? (
                  <div className="p-8 text-center bg-slate-50 rounded-xl border border-dashed border-slate-300">
                    <p className="text-slate-600 font-semibold text-sm">No 1:1 sessions logged for this subject yet.</p>
                    <p className="text-xs text-slate-500 mt-1">Mukund Sir will update your personal notes after your next class!</p>
                  </div>
                ) : (
                  filteredSessions.map(sess => (
                    <div key={sess.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-3 hover:shadow-md transition">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className={`px-2.5 py-0.5 rounded text-[10px] font-extrabold uppercase ${
                            sess.subject === 'Physics' ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' :
                            sess.subject === 'Chemistry' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                            sess.subject === 'Biology' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-200 text-slate-800'
                          }`}>
                            {sess.subject}
                          </span>
                          <h4 className="font-extrabold text-slate-900 text-base mt-1.5">{sess.topic}</h4>
                        </div>
                        <span className="text-xs font-bold text-slate-500 bg-white px-2.5 py-1 rounded-lg border">
                          📅 {sess.date}
                        </span>
                      </div>

                      {sess.notesText && (
                        <p className="text-xs text-slate-600 bg-white p-3 rounded-xl border border-slate-200/80 font-mono">
                          {sess.notesText}
                        </p>
                      )}

                      <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-200/60">
                        {sess.notesUrl ? (
                          <a
                            href={sess.notesUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-3.5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                          >
                            <Icons.FileText /> Open Notes PDF
                          </a>
                        ) : (
                          <span className="px-3 py-1.5 bg-slate-100 text-slate-400 rounded-lg text-xs italic">No Notes Link</span>
                        )}

                        {sess.videoUrl ? (
                          <a
                            href={sess.videoUrl}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-3.5 py-2 bg-rose-700 hover:bg-rose-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                          >
                            <Icons.Video /> Watch Recording
                          </a>
                        ) : (
                          <span className="px-3 py-1.5 bg-slate-100 text-slate-400 rounded-lg text-xs italic">No Video Link</span>
                        )}

                        <button
                          onClick={() => setResourceModal(sess)}
                          className="px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg text-xs transition ml-auto"
                        >
                          View Details
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
