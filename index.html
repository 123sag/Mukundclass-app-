    let supabase = null;
    try {
      if (SUPABASE_URL && !SUPABASE_URL.startsWith("PASTE_") && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("PASTE_")) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase config notice:", e);
    }

    const INITIAL_TUTOR_SETTINGS = {
      tutorName: "Mukund Wankhede",
      platformName: "Mukund Online Classes",
      tagline: "Turning Every Stone, Shine Like a Diamond 💎",
      qualification: "Founder & Lead PCB Educator • 1:1 Personal Mentorship"

    const INITIAL_STUDENTS = [
      { id: "tutor1", username: "mukund", password: "123", role: "tutor", name: "Mukund Wankhede", status: "approved" }
    ];

    const INITIAL_SESSIONS = [];
    const INITIAL_SCHEDULED_CLASSES = [];
    const INITIAL_NOTIFICATIONS = [];

    // Maps the app's internal collection names to actual Supabase table names.
    const TABLES = {
      users: 'pcb_users',
      sessions: 'pcb_sessions',
      scheduledClasses: 'pcb_scheduled_classes',
      notifications: 'pcb_notifications'
    };

    window.PCB_DB = {
      isFirebaseActive: false, // kept as-is so the rest of the app doesn't need renaming

      initRealtimeListeners: async (onStatusChange, onDataSync) => {
        if (!supabase) {
          onStatusChange({ active: false, label: "Local DB Mode" });
          return;
        }

        try {
          const syncTable = async (tableKey, seedData) => {
            const table = TABLES[tableKey];
            const { data, error } = await supabase.from(table).select('*');
            if (error) { console.error(table + " read err:", error); return; }

            if (!data || data.length === 0) {
              if (seedData && seedData.length) {
                await supabase.from(table).upsert(seedData.map(item => ({ id: item.id, data: item })));
              }
              onDataSync(tableKey, seedData || []);
            } else {
              onDataSync(tableKey, data.map(row => ({ ...row.data, id: row.id })));
            }

            supabase
              .channel(table + '-changes')
              .on('postgres_changes', { event: '*', schema: 'public', table }, async () => {
                const { data: fresh, error: freshErr } = await supabase.from(table).select('*');
                if (freshErr) { console.error(table + " resync err:", freshErr); return; }
                onDataSync(tableKey, (fresh || []).map(row => ({ ...row.data, id: row.id })));
              })
              .subscribe();
          };

          await syncTable('users', INITIAL_STUDENTS);
          await syncTable('sessions', INITIAL_SESSIONS);
          await syncTable('scheduledClasses', INITIAL_SCHEDULED_CLASSES);
          await syncTable('notifications', INITIAL_NOTIFICATIONS);

          // settings is a single row, handled separately
          const { data: settingsRows, error: settingsErr } = await supabase
            .from('pcb_settings').select('*').eq('id', 'tutorSettings');
          if (settingsErr) { console.error("Settings read err:", settingsErr); }

          if (!settingsRows || settingsRows.length === 0) {
            await supabase.from('pcb_settings').upsert({ id: 'tutorSettings', data: INITIAL_TUTOR_SETTINGS });
            onDataSync('tutorSettings', INITIAL_TUTOR_SETTINGS);
          } else {
            onDataSync('tutorSettings', settingsRows[0].data);
          }

          supabase
            .channel('pcb_settings-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'pcb_settings' }, async () => {
              const { data: fresh } = await supabase.from('pcb_settings').select('*').eq('id', 'tutorSettings');
              if (fresh && fresh[0]) onDataSync('tutorSettings', fresh[0].data);
            })
            .subscribe();

          window.PCB_DB.isFirebaseActive = true;
          onStatusChange({ active: true, label: "⚡ Real-Time DB Live" });
        } catch (e) {
          console.error("Supabase init error:", e);
          onStatusChange({ active: false, label: "Offline Mode" });
        }
      },

      saveUser: (user) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.users).upsert({ id: user.id, data: user }).then(({ error }) => error && console.error(error));
        }
      },
      deleteUser: (userId) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.users).delete().eq('id', userId).then(({ error }) => error && console.error(error));
        }
      },
      saveSession: (session) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.sessions).upsert({ id: session.id, data: session }).then(({ error }) => error && console.error(error));
        }
      },
      deleteSession: (sessionId) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.sessions).delete().eq('id', sessionId).then(({ error }) => error && console.error(error));
        }
      },
      saveScheduledClass: (sch) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.scheduledClasses).upsert({ id: sch.id, data: sch }).then(({ error }) => error && console.error(error));
        }
      },
      deleteScheduledClass: (schId) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.scheduledClasses).delete().eq('id', schId).then(({ error }) => error && console.error(error));
        }
      },
      saveNotification: (notif) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from(TABLES.notifications).upsert({ id: notif.id, data: notif }).then(({ error }) => error && console.error(error));
        }
      },
      saveSettings: (settings) => {
        if (supabase && window.PCB_DB.isFirebaseActive) {
          supabase.from('pcb_settings').upsert({ id: 'tutorSettings', data: settings }).then(({ error }) => error && console.error(error));
        }
      },
      INITIAL_STUDENTS,
      INITIAL_SESSIONS,
      INITIAL_SCHEDULED_CLASSES,
      INITIAL_NOTIFICATIONS,
      INITIAL_TUTOR_SETTINGS
    };
  </script>

                            target="_blank"
                            rel="noopener noreferrer"
                            className="w-full sm:w-auto px-4 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-95"
                          >
                            <span className="animate-pulse text-base">🎥</span>
                            <span>Join 1:1 Live Class</span>
                            <svg className="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                          </a>
                          <span className="text-[10px] text-emerald-800 font-semibold mt-1">
                            Opens Google Meet / Zoom in a new tab ↗
                          </span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-b pb-4">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-lg">My 1:1 Learning Register</h3>
                    <p className="text-xs text-slate-500">Your personalized class notes and recording history with Mukund Sir</p>
                  </div>

                  <div className="flex flex-wrap gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button
                      onClick={() => setSubjectFilter('ALL')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${subjectFilter === 'ALL' ? 'bg-slate-900 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}
                    >
                      All ({sessions.length})
                    </button>
                    {availableSubjects.map(subj => (
                      <button
                        key={subj}
                        onClick={() => setSubjectFilter(subj)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${subjectFilter === subj ? 'bg-emerald-700 text-white shadow' : 'text-slate-600 hover:bg-slate-200'}`}
                      >
                        {subj === 'Physics' ? '⚡ Physics' : subj === 'Chemistry' ? '🧪 Chemistry' : subj === 'Biology' ? '🧬 Biology' : subj}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-4">
                  {filteredSessions.length === 0 ? (
                    <div className="p-8 text-center bg-slate-50 rounded-xl border border-dashed border-slate-300">
                      <p className="text-slate-600 font-semibold text-sm">No 1:1 sessions logged for this subject yet.</p>
                      <p className="text-xs text-slate-500 mt-1">Mukund Sir will update your personal notes after your next class!</p>
                    </div>
                  ) : (
                    filteredSessions.map(sess => (
                      <div key={sess.id} className="p-4 rounded-2xl border border-slate-200 bg-slate-50/50 space-y-3 hover:shadow-md transition">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className={`px-2.5 py-0.5 rounded text-[10px] font-extrabold uppercase ${
                              sess.subject === 'Physics' ? 'bg-indigo-100 text-indigo-800 border border-indigo-200' :
                              sess.subject === 'Chemistry' ? 'bg-amber-100 text-amber-800 border border-amber-200' :
                              sess.subject === 'Biology' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-200 text-slate-800'
                            }`}>
                              {sess.subject}
                            </span>
                            <h4 className="font-extrabold text-slate-900 text-base mt-1.5">{sess.topic}</h4>
                          </div>
                          <span className="text-xs font-bold text-slate-500 bg-white px-2.5 py-1 rounded-lg border">
                            📅 {sess.date}
                          </span>
                        </div>

                        {sess.notesText && (
                          <p className="text-xs text-slate-600 bg-white p-3 rounded-xl border border-slate-200/80 font-mono">
                            {sess.notesText}
                          </p>
                        )}

                        <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-200/60">
                          {sess.notesUrl ? (
                            <a
                              href={sess.notesUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-3.5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                            >
                              <Icons.FileText /> Open Notes PDF
                            </a>
                          ) : (
                            <span className="px-3 py-1.5 bg-slate-100 text-slate-400 rounded-lg text-xs italic">No Notes Link</span>
                          )}

                          {sess.videoUrl ? (
                            <a
                              href={sess.videoUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="px-3.5 py-2 bg-rose-700 hover:bg-rose-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm"
                            >
                              <Icons.Video /> Watch Recording
                            </a>
                          ) : (
                            <span className="px-3 py-1.5 bg-slate-100 text-slate-400 rounded-lg text-xs italic">No Video Link</span>
                          )}

                          <button
                            onClick={() => setResourceModal(sess)}
                            className="px-3.5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg text-xs transition ml-auto"
                          >
                            View Details
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [tutorSettings, setTutorSettings] = useState(() => {
        const saved = localStorage.getItem('pcb_tutor_settings');
        return saved ? JSON.parse(saved) : (window.PCB_DB?.INITIAL_TUTOR_SETTINGS || {});
      });

      const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('pcb_users');
        return saved ? JSON.parse(saved) : (window.PCB_DB?.INITIAL_STUDENTS || []);
      });

      const [sessions, setSessions] = useState(() => {
        const saved = localStorage.getItem('pcb_sessions');
        return saved ? JSON.parse(saved) : (window.PCB_DB?.INITIAL_SESSIONS || []);
      });

      const [scheduledClasses, setScheduledClasses] = useState(() => {
        const saved = localStorage.getItem('pcb_scheduled_classes');
        return saved ? JSON.parse(saved) : (window.PCB_DB?.INITIAL_SCHEDULED_CLASSES || []);
      });

      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('pcb_notifications');
        return saved ? JSON.parse(saved) : (window.PCB_DB?.INITIAL_NOTIFICATIONS || []);
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('pcb_current_user');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return null;
      });

      const [authMode, setAuthMode] = useState('login');
      const [loginRole, setLoginRole] = useState('student');
      const [resourceModal, setResourceModal] = useState(null); 
      const [notification, setNotification] = useState(null);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [dbStatus, setDbStatus] = useState({ active: false, label: "Connecting..." });

      useEffect(() => {
        if (window.PCB_DB && window.PCB_DB.initRealtimeListeners) {
          window.PCB_DB.initRealtimeListeners(
            (status) => setDbStatus(status),
            (key, data) => {
              if (key === 'users') setUsers(data);
              if (key === 'sessions') setSessions(data);
              if (key === 'scheduledClasses') setScheduledClasses(data);
              if (key === 'notifications') setNotifications(data);
              if (key === 'tutorSettings') setTutorSettings(data);
            }
          );
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('pcb_tutor_settings', JSON.stringify(tutorSettings));
      }, [tutorSettings]);

      useEffect(() => {
        localStorage.setItem('pcb_users', JSON.stringify(users));
      }, [users]);

      useEffect(() => {
        localStorage.setItem('pcb_sessions', JSON.stringify(sessions));
      }, [sessions]);

      useEffect(() => {
        localStorage.setItem('pcb_scheduled_classes', JSON.stringify(scheduledClasses));
      }, [scheduledClasses]);

      useEffect(() => {
        localStorage.setItem('pcb_notifications', JSON.stringify(notifications));
      }, [notifications]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('pcb_current_user', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('pcb_current_user');
        }
      }, [currentUser]);

      const approvedStudents = useMemo(() => {
        return users.filter(u => u.role === 'student' && u.status === 'approved');
      }, [users]);

      const pendingStudents = useMemo(() => {
        return users.filter(u => u.role === 'student' && u.status === 'pending');
      }, [users]);

      const totalSeatsFilled = approvedStudents.length;

      const showToast = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const handleApproveStudent = (studentId) => {
        if (totalSeatsFilled >= MAX_CAPACITY) {
          showToast(`Maximum capacity of ${MAX_CAPACITY} students reached! Cannot approve more students right now.`, 'error');
          return;
        }

        const nextSeatNum = totalSeatsFilled + 1;
        const updatedUsers = users.map(u => {
          if (u.id === studentId) {
            const updated = { ...u, status: 'approved', seatNumber: nextSeatNum };
            if (window.PCB_DB && window.PCB_DB.saveUser) window.PCB_DB.saveUser(updated);
            return updated;
          }
          return u;
        });
        setUsers(updatedUsers);
        showToast("Student enrollment approved successfully!", "success");
      };

      const handleDeclineStudent = (studentId) => {
        setUsers(prev => prev.filter(u => u.id !== studentId));
        if (window.PCB_DB && window.PCB_DB.deleteUser) window.PCB_DB.deleteUser(studentId);
        showToast("Student application declined.", "info");
      };

      const handleRemoveStudent = (studentId) => {
        setUsers(prev => prev.filter(u => u.id !== studentId));
        setSessions(prev => prev.filter(s => s.studentId !== studentId));
        if (window.PCB_DB && window.PCB_DB.deleteUser) window.PCB_DB.deleteUser(studentId);
        showToast("Student removed from enrollment roster.", "info");
      };

      const handleAddSession = (newSessionData) => {
        const student = users.find(u => u.id === newSessionData.studentId);
        const newSession = {
          id: 'sess_' + Date.now(),
          studentId: newSessionData.studentId,
          studentName: student ? student.name : "Student",
          subject: newSessionData.subject,
          topic: newSessionData.topic,
          date: newSessionData.date,
          notesUrl: newSessionData.notesUrl || "",
          videoUrl: newSessionData.videoUrl || "",
          notesText: newSessionData.notesText || ""
        };

        setSessions(prev => [newSession, ...prev]);
        if (window.PCB_DB && window.PCB_DB.saveSession) window.PCB_DB.saveSession(newSession);
        showToast(`Logged 1:1 ${newSessionData.subject} coaching session!`, "success");
      };

      const handleScheduleClass = (newClassData) => {
        const student = users.find(u => u.id === newClassData.studentId);
        const newClass = {
          id: 'sch_' + Date.now(),
          studentId: newClassData.studentId,
          studentName: student ? student.name : "Student",
          subject: newClassData.subject,
          topic: newClassData.topic,
          date: newClassData.date,
          time: newClassData.time || "05:00 PM",
          meetUrl: newClassData.meetUrl || "https://meet.google.com/new",
          notes: newClassData.notes || "",
          status: "upcoming"
        };

        const newNotif = {
          id: 'notif_' + Date.now(),
          studentId: newClassData.studentId,
          title: `New 1:1 ${newClassData.subject} Class Scheduled! 📅`,
          message: `Mukund Sir scheduled a live class on "${newClassData.topic}" for ${newClassData.date} at ${newClassData.time || "05:00 PM"}.`,
          meetUrl: newClassData.meetUrl || "https://meet.google.com/new",
          date: new Date().toISOString().split('T')[0],
          read: false
        };

        setScheduledClasses(prev => [newClass, ...prev]);
        setNotifications(prev => [newNotif, ...prev]);

        if (window.PCB_DB && window.PCB_DB.saveScheduledClass) {
          window.PCB_DB.saveScheduledClass(newClass);
          window.PCB_DB.saveNotification(newNotif);
        }

        showToast(`Scheduled 1:1 class for ${student ? student.name : 'Student'} & sent notification!`, "success");
      };

      const handleCancelScheduledClass = (classId) => {
        setScheduledClasses(prev => prev.filter(c => c.id !== classId));
        if (window.PCB_DB && window.PCB_DB.deleteScheduledClass) window.PCB_DB.deleteScheduledClass(classId);
        showToast("Scheduled class cancelled.", "info");
      };

      const handleMarkNotificationRead = (notifId) => {
        const updated = notifications.map(n => {
          if (n.id === notifId) {
            const item = { ...n, read: true };
            if (window.PCB_DB && window.PCB_DB.saveNotification) window.PCB_DB.saveNotification(item);
            return item;
          }
          return n;
        });
        setNotifications(updated);
      };

      const handleDismissAllNotifications = (studentId) => {
        const updated = notifications.map(n => {
          if (n.studentId === studentId) {
            const item = { ...n, read: true };
            if (window.PCB_DB && window.PCB_DB.saveNotification) window.PCB_DB.saveNotification(item);
            return item;
          }
          return n;
        });
        setNotifications(updated);
      };

      const handleDeleteSession = (sessionId) => {
        setSessions(prev => prev.filter(s => s.id !== sessionId));
        if (window.PCB_DB && window.PCB_DB.deleteSession) window.PCB_DB.deleteSession(sessionId);
        showToast("Session entry deleted successfully.", "info");
      };

      const handleClearAllData = () => {
        const adminUser = { id: "tutor1", username: "mukund", password: "123", role: "tutor", name: "Mukund Wankhede", status: "approved" };
        setUsers([adminUser]);
        setSessions([]);
        setScheduledClasses([]);
        setNotifications([]);

        localStorage.removeItem('pcb_users');
        localStorage.removeItem('pcb_sessions');
        localStorage.removeItem('pcb_scheduled_classes');
        localStorage.removeItem('pcb_notifications');

        if (window.PCB_DB && window.PCB_DB.isFirebaseActive) {
          if (window.PCB_DB.saveUser) window.PCB_DB.saveUser(adminUser);
        }

        showToast("Database completely cleared! Only Mukund Sir's admin account remains.", "success");
      };

      const unreadCount = useMemo(() => {
        if (!currentUser || currentUser.role !== 'student') return 0;
        return notifications.filter(n => n.studentId === currentUser.id && !n.read).length;
      }, [currentUser, notifications]);

      const studentSessions = useMemo(() => {
        if (!currentUser || currentUser.role !== 'student') return [];
        return sessions.filter(s => s.studentId === currentUser.id);
      }, [currentUser, sessions]);

      const studentScheduledClasses = useMemo(() => {
        if (!currentUser || currentUser.role !== 'student') return [];
        return scheduledClasses.filter(c => c.studentId === currentUser.id);
      }, [currentUser, scheduledClasses]);

      const studentNotifications = useMemo(() => {
        if (!currentUser || currentUser.role !== 'student') return [];
        return notifications.filter(n => n.studentId === currentUser.id);
      }, [currentUser, notifications]);

      return (
        <div className="min-h-screen flex flex-col paper-texture">
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-2xl shadow-xl text-xs font-bold transition-all flex items-center gap-2 border ${
              notification.type === 'success' ? 'bg-emerald-900 text-white border-emerald-700' :
              notification.type === 'error' ? 'bg-rose-900 text-white border-rose-700' :
              'bg-slate-900 text-white border-slate-700'
            }`}>
              <span>{notification.type === 'success' ? '✅' : notification.type === 'error' ? '⚠️' : 'ℹ️'}</span>
              <span>{notification.message}</span>
            </div>
          )}

          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <MukundLogo className="h-9" />
              </div>

              <div className="flex items-center space-x-3">
                <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold flex items-center gap-1 border ${
                  dbStatus.active ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'
                }`}>
                  <span className={`w-1.5 h-1.5 rounded-full ${dbStatus.active ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                  {dbStatus.label}
                </span>

                {currentUser ? (
                  <div className="flex items-center space-x-3 pl-3 border-l border-slate-800">
                    <div className="text-right hidden sm:block">
                      <p className="text-xs font-extrabold text-white leading-none">{currentUser.name}</p>
                      <p className="text-[10px] text-slate-400 mt-0.5 uppercase font-semibold">
                        {currentUser.role === 'tutor' ? '👑 Admin (Tutor)' : `🎓 Class ${currentUser.grade}`}
                      </p>
                    </div>

                    {currentUser.role === 'tutor' && (
                      <button
                        onClick={() => setIsSettingsOpen(true)}
                        className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition"
                        title="Tutor Platform Settings"
                      >
                        <Icons.Settings />
                      </button>
                    )}

                    <button
                      onClick={() => {
                        setCurrentUser(null);
                        showToast("Logged out successfully.", "info");
                      }}
                      className="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-1"
                      title="Log Out"
                    >
                      <Icons.LogOut />
                      <span className="hidden sm:inline">Logout</span>
                    </button>
                  </div>
                ) : (
                  <span className="text-xs font-semibold text-slate-400 italic">1:1 Coaching Register</span>
                )}
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">
            {!currentUser ? (
              <AuthScreen
                authMode={authMode}
                setAuthMode={setAuthMode}
                loginRole={loginRole}
                setLoginRole={setLoginRole}
                users={users}
                setUsers={setUsers}
                setCurrentUser={setCurrentUser}
                showToast={showToast}
                totalSeatsFilled={totalSeatsFilled}
                maxCapacity={MAX_CAPACITY}
                tutorSettings={tutorSettings}
              />
            ) : currentUser.role === 'tutor' ? (
              <TutorDashboard
                tutorSettings={tutorSettings}
                setTutorSettings={setTutorSettings}
                users={users}
                approvedStudents={approvedStudents}
                pendingStudents={pendingStudents}
                totalSeatsFilled={totalSeatsFilled}
                maxCapacity={MAX_CAPACITY}
                sessions={sessions}
                scheduledClasses={scheduledClasses}
                onApproveStudent={handleApproveStudent}
                onDeclineStudent={handleDeclineStudent}
                onRemoveStudent={handleRemoveStudent}
                onAddSession={handleAddSession}
                onScheduleClass={handleScheduleClass}
                onCancelScheduledClass={handleCancelScheduledClass}
                onDeleteSession={handleDeleteSession}
                setResourceModal={setResourceModal}
              />
            ) : (
              <StudentDashboard
                student={currentUser}
                sessions={studentSessions}
                scheduledClasses={studentScheduledClasses}
                notifications={studentNotifications}
                tutorSettings={tutorSettings}
                setResourceModal={setResourceModal}
                onMarkNotificationRead={handleMarkNotificationRead}
                onDismissAllNotifications={handleDismissAllNotifications}
              />
            )}
          </main>

          {resourceModal && (
            <ResourceModal session={resourceModal} onClose={() => setResourceModal(null)} />
          )}

          {isSettingsOpen && (
            <SettingsModal
              tutorSettings={tutorSettings}
              setTutorSettings={setTutorSettings}
              onClose={() => setIsSettingsOpen(false)}
              showToast={showToast}
              onClearAllData={handleClearAllData}
            />
          )}

          <footer className="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-auto">
            <div className="max-w-7xl mx-auto px-4 text-center space-y-2">
              <p className="text-slate-300 font-semibold">{tutorSettings.platformName} • Personal Mentorship Platform</p>
              <p className="text-slate-500">Excellence in Physics, Chemistry & Biology Coaching (Classes 9-12 • NEET • KCET)</p>
            </div>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
